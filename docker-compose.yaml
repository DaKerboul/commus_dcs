# Docker Compose for self-hosted / Coolify deployment
services:

  # ─── Application Nuxt ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commus-dcs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://commus:${DB_PASSWORD:-commus}@db:5432/commus_dcs
      - NUXT_DATABASE_URL=postgresql://commus:${DB_PASSWORD:-commus}@db:5432/commus_dcs
      # Override ALL variables below in Coolify — fallbacks are insecure placeholders only
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:-change-me-to-a-32-char-secret!!}
      - NUXT_SESSION_SECRET=${NUXT_SESSION_SECRET:-}
      # Break-glass only — Authelia is the normal admin sign-in. The password
      # route answers 404 unless the fallback below is explicitly turned on.
      - NUXT_ADMIN_PASSWORD=${NUXT_ADMIN_PASSWORD:-admin}
      - NUXT_ADMIN_PASSWORD_FALLBACK=${NUXT_ADMIN_PASSWORD_FALLBACK:-false}
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-http://localhost:3050}
      # Notifications Telegram — bot partagé avec Gjallarhorn (envoi seul)
      - NUXT_TELEGRAM_BOT_TOKEN=${NUXT_TELEGRAM_BOT_TOKEN:-}
      - NUXT_TELEGRAM_CHAT_ID=${NUXT_TELEGRAM_CHAT_ID:-}
      - NUXT_RUN_NOTIFICATIONS=${NUXT_RUN_NOTIFICATIONS:-true}
      - NUXT_TWITCH_CLIENT_ID=${NUXT_TWITCH_CLIENT_ID:-}
      - NUXT_TWITCH_CLIENT_SECRET=${NUXT_TWITCH_CLIENT_SECRET:-}
      - NUXT_OAUTH_DISCORD_CLIENT_ID=${NUXT_OAUTH_DISCORD_CLIENT_ID:-}
      - NUXT_OAUTH_DISCORD_CLIENT_SECRET=${NUXT_OAUTH_DISCORD_CLIENT_SECRET:-}
      # Admin SSO via Authelia — absent means password-only login
      - NUXT_OAUTH_OIDC_CLIENT_ID=${NUXT_OAUTH_OIDC_CLIENT_ID:-}
      - NUXT_OAUTH_OIDC_CLIENT_SECRET=${NUXT_OAUTH_OIDC_CLIENT_SECRET:-}
      - NUXT_OAUTH_OIDC_OPENID_CONFIG=${NUXT_OAUTH_OIDC_OPENID_CONFIG:-}
      - NUXT_ADMIN_OIDC_USERNAME=${NUXT_ADMIN_OIDC_USERNAME:-}
    ports:
      - "${PORT:-3050}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: commus-dcs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: commus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-commus}
      POSTGRES_DB: commus_dcs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commus -d commus_dcs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    driver: local
